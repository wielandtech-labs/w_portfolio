# wielandtech.com: static Astro build plus one proxied API path.
# Replaces /etc/nginx/conf.d/default.conf in nginxinc/nginx-unprivileged
# (http context; pid and temp paths already point at /tmp, and the root
# filesystem is read-only in the cluster).

proxy_cache_path /tmp/nginx-cache levels=1 keys_zone=metrics:1m max_size=8m inactive=10m use_temp_path=off;

# Resolve the w_tech Service at request time, not at startup: nginx still
# boots, and only /api/metrics/ fails, if the name can't be resolved.
resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;
resolver_timeout 2s;

server_tokens off;

# www -> apex, keeping path and query.
server {
    listen 8080;
    server_name www.wielandtech.com;
    return 301 https://wielandtech.com$request_uri;
}

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # TLS ends at Traefik; never build redirects from nginx's own scheme/port.
    absolute_redirect off;
    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets never change.
    location ^~ /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Pages this site owns: unknown paths below them get the site's own 404.
    location ~ ^/(work|services|contact)(/|$) {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ $uri.html =404;
    }

    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        internal;
    }

    # The old portfolio page lives on as a case study.
    location ~ ^/homelab/?$ {
        return 308 /work/homelab/;
    }

    # Live homelab stats, same-origin for the browser (no CORS, CSP stays
    # 'self'). Read-only public data, so every environment uses prod's w_tech.
    location = /api/metrics/ {
        include /etc/nginx/snippets/security-headers.conf;
        set $metrics_upstream http://website.website.svc.cluster.local:8000;
        proxy_pass $metrics_upstream/api/metrics/;
        proxy_set_header Host raphaelwieland.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Content-Security-Policy;
        proxy_ignore_headers Set-Cookie Cache-Control Expires Vary;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_cache metrics;
        proxy_cache_valid 200 30s;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        add_header Cache-Control "no-store" always;
    }

    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files /index.html =404;
    }

    # Everything else this site doesn't serve belongs to the personal site:
    # keep old links (blog posts, photos, accounts) working.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri.html @personal;
    }

    location @personal {
        return 308 https://raphaelwieland.com$request_uri;
    }
}
